[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-evidence-workbench"
version = "0.1.0"
description = "Offline defensive SOC triage with bounded evidence correlation and optional loopback model narratives"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
keywords = ["security", "soc", "incident-response", "evidence", "ollama", "defensive-security"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Security"]

[project.scripts]
incident-workbench = "incident_workbench.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
incident_workbench = ["ui/*.html", "ui/*.js", "ui/*.css", "ui/*.jsonl"]
